<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 28" width="100%" height="28">
  <defs>
    <linearGradient id="dividerGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00e5ff" stop-opacity="0" />
      <stop offset="25%" stop-color="#00e5ff" stop-opacity="0.3" />
      <stop offset="45%" stop-color="#00e5ff" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="1" />
      <stop offset="55%" stop-color="#a855f7" stop-opacity="0.9" />
      <stop offset="75%" stop-color="#a855f7" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#a855f7" stop-opacity="0" />
    </linearGradient>

    <style>
      .mono { font-family: 'SF Mono', 'Segoe UI Mono', monospace; font-size: 8px; fill: #64748b; letter-spacing: 2px; }
      @keyframes pulseNode {
        0%, 100% { transform: scale(1); opacity: 0.9; }
        50% { transform: scale(1.15); opacity: 0.5; }
      }
      .node-pulse {
        transform-origin: 450px 14px;
        animation: pulseNode 3s ease-in-out infinite;
      }
      @media (prefers-reduced-motion: reduce) {
        .node-pulse { animation: none !important; }
      }
    </style>
  </defs>

  <!-- Muted Background Track -->
  <line x1="100" y1="14" x2="800" y2="14" stroke="#1e293b" stroke-width="1" stroke-opacity="0.6" />

  <!-- Primary Glowing Optic Line -->
  <line x1="150" y1="14" x2="750" y2="14" stroke="url(#dividerGrad)" stroke-width="1.6" />

  <!-- Center Diamond & Glowing Ring -->
  <g class="node-pulse">
    <circle cx="450" cy="14" r="8" fill="none" stroke="#00e5ff" stroke-width="0.8" stroke-opacity="0.4" />
    <polygon points="450,8 456,14 450,20 444,14" fill="#00e5ff" />
    <circle cx="450" cy="14" r="2" fill="#ffffff" />
  </g>

  <!-- Left & Right Hex Markers -->
  <text class="mono" x="220" y="10" text-anchor="middle">SYS.0x</text>
  <text class="mono" x="680" y="10" text-anchor="middle">LOC.TK</text>

  <circle cx="280" cy="14" r="1.5" fill="#00e5ff" opacity="0.6" />
  <circle cx="620" cy="14" r="1.5" fill="#a855f7" opacity="0.6" />
</svg>
