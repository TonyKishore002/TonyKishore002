<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 850 115" width="100%" height="115">
  <defs>
    <linearGradient id="trustaiGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0815" />
      <stop offset="50%" stop-color="#150f28" />
      <stop offset="100%" stop-color="#0a0818" />
    </linearGradient>

    <linearGradient id="trustaiBorder" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.8" />
      <stop offset="50%" stop-color="#1e293b" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#c084fc" stop-opacity="0.7" />
    </linearGradient>

    <style>
      .mono { font-family: 'SF Mono', 'Segoe UI Mono', 'Roboto Mono', monospace; }
      .sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
      @keyframes signalPulsePurple {
        0%, 100% { opacity: 0.9; }
        50% { opacity: 0.35; }
      }
      .signal-p { animation: signalPulsePurple 3s ease-in-out infinite; }
      @media (prefers-reduced-motion: reduce) {
        .signal-p { animation: none !important; }
      }
    </style>
  </defs>

  <!-- Background Panel -->
  <rect x="2" y="2" width="846" height="111" rx="8" fill="url(#trustaiGrad)" stroke="url(#trustaiBorder)" stroke-width="1.2" />

  <!-- Corner Brackets -->
  <path d="M 2 16 L 2 2 L 16 2" fill="none" stroke="#a855f7" stroke-width="2" />
  <path d="M 834 2 L 848 2 L 848 16" fill="none" stroke="#a855f7" stroke-width="2" />
  <path d="M 2 99 L 2 113 L 16 113" fill="none" stroke="#a855f7" stroke-width="2" />
  <path d="M 834 113 L 848 113 L 848 99" fill="none" stroke="#a855f7" stroke-width="2" />

  <!-- Module Tag & Status -->
  <g transform="translate(24, 25)">
    <rect x="0" y="0" width="86" height="20" rx="4" fill="#a855f7" fill-opacity="0.12" stroke="#a855f7" stroke-opacity="0.4" stroke-width="1" />
    <text class="mono" x="7" y="14" font-size="10" font-weight="700" fill="#a855f7" letter-spacing="1">SYSTEM // 02</text>

    <!-- Project Title -->
    <text class="sans" x="98" y="16" font-size="18" font-weight="800" fill="#f8fafc" letter-spacing="0.5">TrustAI <tspan font-size="14" fill="#a855f7">/ TK-AI</tspan></text>
    <text class="mono" x="228" y="15" font-size="11" font-weight="500" fill="#94a3b8">AI Output Reliability &amp; Autonomous Risk Analysis</text>

    <!-- Status Badge -->
    <rect x="670" y="0" width="130" height="20" rx="4" fill="#a855f7" fill-opacity="0.15" stroke="#a855f7" stroke-opacity="0.5" stroke-width="1" />
    <circle class="signal-p" cx="682" cy="10" r="3.5" fill="#c084fc" />
    <text class="mono" x="692" y="14" font-size="9.5" font-weight="700" fill="#e9d5ff" letter-spacing="0.8">IN DEVELOPMENT</text>
  </g>

  <!-- Technical Spec Summary -->
  <g transform="translate(24, 62)">
    <text class="mono" font-size="11" fill="#cbd5e1">
      <tspan font-weight="700" fill="#c084fc">CORE PIPELINE:</tspan> Multi-Turn Intake <tspan fill="#475569">→</tspan> Response Stability Check <tspan fill="#475569">→</tspan> Consistency Evaluation <tspan fill="#475569">→</tspan> Risk Report
    </text>
    <text class="mono" y="24" font-size="10.5" fill="#64748b">
      STACK: <tspan fill="#94a3b8">Python</tspan> • <tspan fill="#94a3b8">FastAPI</tspan> • <tspan fill="#94a3b8">LangChain</tspan> • <tspan fill="#94a3b8">ML Reliability Metrics</tspan>
      <tspan fill="#334155"> | </tspan>
      DOMAIN: <tspan fill="#a855f7">AI VERIFICATION</tspan>
    </text>
  </g>
</svg>
